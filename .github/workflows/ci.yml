name: Validate skill

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Agent Skills format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The specification requires the directory name to match the skill name.
          path: personalizer
          persist-credentials: false

      - name: Set up Python for the reference validator
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the pinned Agent Skills reference validator
        run: python -m pip install -r personalizer/requirements-dev.txt

      - name: Validate the skill format
        run: skills-ref validate "$GITHUB_WORKSPACE/personalizer"

  helper-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out the skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run measurement helper tests
        run: python -m unittest discover -s tests -v
